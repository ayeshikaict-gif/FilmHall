{% extends "base.html" %}

{% block content %}
<section class="section-container" style="max-width: 600px; margin: 0 auto;">
    <h1 class="section-title" style="margin-bottom: 2rem;">Customer Account Profile</h1>

    <div style="background: var(--bg-card); padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color);">
        <form method="POST" action="{{ url_for('customer.profile') }}">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address (Read Only)</label>
                <input type="email" class="form-control" value="{{ user.email }}" disabled style="opacity: 0.6;">
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control" value="{{ user.phone }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Account Role</label>
                <input type="text" class="form-control" value="{{ user.role_name }}" disabled style="opacity: 0.6;">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Update Profile Details</button>
        </form>
    </div>
</section>
{% endblock %}
