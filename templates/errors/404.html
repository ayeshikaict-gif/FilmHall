{% extends "base.html" %}

{% block content %}
<section class="section-container" style="text-align: center; padding: 6rem 2rem;">
    <i class="fa-solid fa-film-simple" style="font-size: 4rem; color: var(--gold); margin-bottom: 1.5rem;"></i>
    <h1 style="font-family: var(--font-heading); font-size: 3rem; color: var(--gold);">404 - Page Not Found</h1>
    <p style="color: var(--text-muted); font-size: 1.1rem; margin-top: 10px; max-width: 500px; margin-left: auto; margin-right: auto;">
        The cinematic experience you are looking for does not exist or has been moved.
    </p>
    <a href="{{ url_for('customer.index') }}" class="btn-primary" style="margin-top: 2rem; display: inline-block;">
        Return to Home Page
    </a>
</section>
{% endblock %}
